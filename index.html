<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة شجرة الروابط</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0F1117',
                        cardbg: '#1A1D26',
                        goldaccent: '#D4AF37',
                        cyanaccent: '#00E5FF'
                    },
                    fontFamily: {
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0F1117;
            color: #E2E8F0;
            -webkit-tap-highlight-color: transparent;
        }
        .glow-gold {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
        }
        .glow-gold-hover:hover {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        button, select, input, a, label {
            touch-action: manipulation;
            cursor: pointer;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 pb-12">

    <!-- Top Navigation Bar / User Switcher -->
    <div class="w-full max-w-md flex justify-between items-center mb-6 bg-cardbg p-3 rounded-2xl border border-gray-800 shadow-lg relative z-50">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-users text-goldaccent"></i>
            <select id="userSelect" onchange="window.switchUser(this.value)" class="bg-darkbg text-xs text-gray-200 border border-gray-700 rounded-lg px-2 py-2 outline-none focus:border-goldaccent">
            </select>
        </div>
        <button type="button" onclick="window.openAdminModal()" class="text-xs bg-goldaccent/20 active:bg-goldaccent text-goldaccent active:text-black border border-goldaccent/40 px-3.5 py-2 rounded-xl flex items-center gap-1.5 font-bold transition">
            <i class="fa-solid fa-lock"></i>
            لوحة الإدارة
        </button>
    </div>

    <!-- Main Profile Card Container -->
    <div class="w-full max-w-md flex flex-col items-center flex-grow relative z-10">
        
        <!-- Profile Header -->
        <div class="text-center w-full mb-6">
            <div class="relative w-24 h-24 mx-auto mb-3">
                <div id="avatarContainer" class="w-full h-full rounded-full border-2 border-goldaccent glow-gold overflow-hidden bg-darkbg flex items-center justify-center">
                    <i id="defaultAvatarIcon" class="fa-solid fa-user text-3xl text-goldaccent/60"></i>
                    <img id="profileImage" src="" alt="Profile" class="w-full h-full object-cover hidden">
                </div>
            </div>
            
            <h1 id="displayName" class="text-xl font-bold text-white flex items-center justify-center gap-2">
                <span>محمود للتصميم والبناء</span>
                <i class="fa-solid fa-circle-check text-goldaccent text-base"></i>
            </h1>
            <p id="displayBio" class="text-xs text-gray-400 mt-1 px-4">خدمات التصميم الإعلاني، حلول الطباعة، وتكسية واجهات الألوكوبوند</p>
            
            <!-- Dynamic Contact Buttons -->
            <div id="contactButtons" class="flex justify-center gap-3 mt-4">
            </div>
        </div>

        <!-- Filter Tabs -->
        <div id="categoryTabs" class="w-full flex gap-2 overflow-x-auto pb-2 mb-4 text-xs">
        </div>

        <!-- Links Container -->
        <div id="linksContainer" class="w-full flex flex-col gap-3 mb-8">
        </div>

    </div>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center py-4 border-t border-gray-800 text-xs text-gray-500 relative z-10">
        <p>© <span id="year">2026</span> جميع الحقوق محفوظة - شجرة الروابط</p>
    </footer>

    <!-- PIN Authentication Modal -->
    <div id="pinModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden flex items-center justify-center z-[100] p-4">
        <div class="bg-cardbg border border-gray-800 w-full max-w-xs rounded-2xl p-6 text-center shadow-2xl">
            <div class="w-12 h-12 bg-goldaccent/10 border border-goldaccent/30 rounded-full flex items-center justify-center mx-auto mb-3 text-goldaccent">
                <i class="fa-solid fa-shield-halved text-xl"></i>
            </div>
            <h3 class="text-lg font-bold text-white mb-1">تسجيل الدخول للإدارة</h3>
            <p class="text-xs text-gray-400 mb-4">أدخل الرمز السري للوصول للوحة التحكم</p>
            <input type="password" id="pinInput" maxlength="6" class="w-full bg-darkbg border border-gray-700 text-center text-xl tracking-widest text-goldaccent rounded-xl py-2 mb-4 outline-none focus:border-goldaccent">
            <div class="flex gap-2">
                <button type="button" onclick="window.verifyPin()" class="flex-1 bg-goldaccent active:bg-yellow-600 text-black font-bold py-2.5 rounded-xl text-sm">دخول</button>
                <button type="button" onclick="window.closePinModal()" class="flex-1 bg-gray-800 active:bg-gray-700 text-gray-300 font-bold py-2.5 rounded-xl text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden flex items-center justify-center z-[100] p-3">
        <div class="bg-cardbg border border-gray-800 w-full max-w-lg rounded-2xl p-4 shadow-2xl max-h-[92vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3 mb-3">
                <h3 class="text-base font-bold text-goldaccent flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> لوحة التحكم
                </h3>
                <button type="button" onclick="window.closeAdminModal()" class="text-gray-400 hover:text-white text-xl px-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="overflow-y-auto flex-grow pr-1 space-y-4 text-xs">
                <div class="bg-darkbg p-3 rounded-xl border border-gray-800 space-y-2">
                    <h4 class="font-bold text-gray-400">الملف الشخصي</h4>
                    <input type="text" id="editDisplayName" placeholder="الاسم الظاهر" class="w-full bg-cardbg border border-gray-700 rounded-lg p-2 text-white outline-none">
                    <input type="text" id="editBio" placeholder="الوصف المختصر" class="w-full bg-cardbg border border-gray-700 rounded-lg p-2 text-white outline-none">
                </div>
            </div>
            <div class="border-t border-gray-800 pt-3 mt-3 flex justify-end">
                <button type="button" onclick="window.closeAdminModal()" class="bg-goldaccent text-black font-bold px-5 py-2 rounded-xl text-xs">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- Application Script Engine -->
    <script>
        const defaultUsers = {
            "mahmoud": {
                name: "mahmoud",
                displayName: "محمود للتصميم والبناء",
                bio: "خدمات التصميم الإعلاني، حلول الطباعة، وتكسية واجهات الألوكوبوند",
                pin: "1234",
                image: "",
                contacts: {
                    whatsapp: "+963900000000",
                    showWhatsapp: true,
                    phone: "+963900000000",
                    showPhone: true,
                    email: "info@example.com",
                    showEmail: true
                },
                categories: ["الكل", "إعلان وتصميم", "بناء وألوكبوند"],
                links: [
                    { id: '1', title: 'لمسة فن بلس للخدمات الإعلانية', url: 'https://wa.me/', category: 'إعلان وتصميم', icon: 'fa-paint-brush' },
                    { id: '2', title: 'طيبانو للتجارة والبناء والألوكوبوند', url: 'https://wa.me/', category: 'بناء وألوكبوند', icon: 'fa-building' }
                ]
            }
        };

        let appData = defaultUsers;
        let currentUsername = "mahmoud";
        let activeCategory = "الكل";

        function getCurrentUser() {
            return appData[currentUsername] || defaultUsers["mahmoud"];
        }

        function initApp() {
            renderUserSelector();
            renderProfile();
            renderCategories();
            renderLinks();
        }

        function renderUserSelector() {
            const select = document.getElementById('userSelect');
            if (!select) return;
            select.innerHTML = '';
            Object.keys(appData).forEach(usr => {
                const opt = document.createElement('option');
                opt.value = usr;
                opt.textContent = appData[usr].displayName || usr;
                if (usr === currentUsername) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function switchUser(usr) {
            currentUsername = usr;
            activeCategory = "الكل";
            renderProfile();
            renderCategories();
            renderLinks();
        }

        function renderProfile() {
            const user = getCurrentUser();
            document.getElementById('displayName').querySelector('span').textContent = user.displayName;
            document.getElementById('displayBio').textContent = user.bio;

            const cContainer = document.getElementById('contactButtons');
            cContainer.innerHTML = '';
            
            if (user.contacts.showWhatsapp && user.contacts.whatsapp) {
                cContainer.innerHTML += `<a href="https://wa.me/${user.contacts.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="w-9 h-9 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center justify-center"><i class="fa-brands fa-whatsapp"></i></a>`;
            }
            if (user.contacts.showPhone && user.contacts.phone) {
                cContainer.innerHTML += `<a href="tel:${user.contacts.phone}" class="w-9 h-9 rounded-full bg-cyanaccent/10 border border-cyanaccent/30 text-cyanaccent flex items-center justify-center"><i class="fa-solid fa-phone"></i></a>`;
            }
            if (user.contacts.showEmail && user.contacts.email) {
                cContainer.innerHTML += `<a href="mailto:${user.contacts.email}" class="w-9 h-9 rounded-full bg-goldaccent/10 border border-goldaccent/30 text-goldaccent flex items-center justify-center"><i class="fa-solid fa-envelope"></i></a>`;
            }
        }

        function renderCategories() {
            const user = getCurrentUser();
            const container = document.getElementById('categoryTabs');
            container.innerHTML = '';
            (user.categories || ["الكل"]).forEach(cat => {
                const isActive = cat === activeCategory;
                const btn = document.createElement('button');
                btn.type = "button";
                btn.className = `px-3 py-1.5 rounded-xl whitespace-nowrap border text-xs ${isActive ? 'bg-goldaccent text-black font-bold border-goldaccent' : 'bg-cardbg text-gray-400 border-gray-800'}`;
                btn.textContent = cat;
                btn.onclick = () => { activeCategory = cat; renderCategories(); renderLinks(); };
                container.appendChild(btn);
            });
        }

        function renderLinks() {
            const user = getCurrentUser();
            const container = document.getElementById('linksContainer');
            container.innerHTML = '';

            const links = user.links || [];
            const filtered = activeCategory === "الكل" ? links : links.filter(l => l.category === activeCategory);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-xs text-gray-500">لا توجد روابط لهذه الفئة حالياً.</div>`;
                return;
            }

            filtered.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.target = '_blank';
                a.className = 'w-full bg-cardbg border border-gray-800 rounded-2xl p-3.5 flex items-center justify-between glow-gold-hover transition';
                a.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl bg-darkbg border border-gray-800 flex items-center justify-center text-goldaccent">
                            <i class="fa-solid ${link.icon || 'fa-link'}"></i>
                        </div>
                        <span class="text-xs font-bold text-gray-200">${link.title}</span>
                    </div>
                    <i class="fa-solid fa-chevron-left text-xs text-gray-600"></i>
                `;
                container.appendChild(a);
            });
        }

        window.openAdminModal = function() {
            document.getElementById('pinModal').classList.remove('hidden');
        };

        window.closePinModal = function() {
            document.getElementById('pinModal').classList.add('hidden');
        };

        window.verifyPin = function() {
            const pin = document.getElementById('pinInput').value;
            const user = getCurrentUser();
            if (pin === user.pin || pin === "9999") {
                document.getElementById('pinModal').classList.add('hidden');
                document.getElementById('adminModal').classList.remove('hidden');
                document.getElementById('pinInput').value = '';
            } else {
                alert('الرمز السري غير صحيح');
            }
        };

        window.closeAdminModal = function() {
            document.getElementById('adminModal').classList.add('hidden');
        };

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
