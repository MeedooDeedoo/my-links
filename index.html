<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمود - شجرة الروابط</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4">

    <!-- Header -->
    <header class="max-w-xl mx-auto w-full flex justify-between items-center mb-6">
        <button onclick="openAdmin()" class="px-4 py-2 rounded-xl bg-cyan-600 text-white text-xs font-bold shadow-lg cursor-pointer flex items-center gap-2">
            <i class="fa-solid fa-sliders"></i> لوحة التحكم الشاملة
        </button>
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center cursor-pointer">
            <i id="theme-icon" class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- Main Profile -->
    <main class="max-w-xl mx-auto w-full flex-1 flex flex-col items-center text-center">
        <div class="w-28 h-28 rounded-full overflow-hidden border-4 border-cyan-500 shadow-xl mb-4">
            <img id="profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300" class="w-full h-full object-cover">
        </div>
        <h1 id="profile-name" class="text-2xl font-extrabold mb-1">محمود</h1>
        <p id="profile-bio" class="text-xs text-slate-400 max-w-sm mb-6 leading-relaxed">مصمم جرافيك ومهندس تصميم واجهات ثلاثي الأبعاد وخبير فصل ألوان وتقنيات الطباعة</p>
        
        <div id="specs-container" class="flex flex-wrap justify-center gap-2 mb-6"></div>
        <div id="social-container" class="flex justify-center gap-3 mb-6"></div>
        <div id="cards-container" class="w-full space-y-3"></div>
    </main>

    <!-- Admin Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 max-h-[90vh] overflow-y-auto text-right text-xs">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                <h3 class="font-bold text-cyan-400 text-sm">لوحة إدارة الموقع</h3>
                <button onclick="closeAdmin()" class="text-slate-400 text-base cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Tabs -->
            <div class="flex gap-2 mb-4 border-b border-slate-800 pb-2 overflow-x-auto">
                <button onclick="switchTab('profile')" id="tab-profile-btn" class="px-3 py-1.5 rounded-lg bg-cyan-600 font-bold text-white cursor-pointer">الملف الشخصي</button>
                <button onclick="switchTab('specs')" id="tab-specs-btn" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-bold cursor-pointer">الاختصاصات</button>
                <button onclick="switchTab('cards')" id="tab-cards-btn" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-bold cursor-pointer">البطاقات</button>
            </div>

            <!-- Tab 1: Profile -->
            <div id="tab-profile" class="space-y-4">
                <div>
                    <label class="block mb-1 font-semibold">الاسم:</label>
                    <input type="text" id="input-name" class="w-full p-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white">
                </div>
                <div>
                    <label class="block mb-1 font-semibold">النبذة التعريفية:</label>
                    <textarea id="input-bio" rows="2" class="w-full p-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white"></textarea>
                </div>
                <div>
                    <label class="block mb-1 font-semibold">رابط الصورة الشخصية:</label>
                    <input type="text" id="input-img" class="w-full p-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white">
                </div>
                <button onclick="saveProfile()" class="w-full py-2.5 bg-cyan-600 text-white font-bold rounded-xl cursor-pointer">حفظ الملف الشخصي</button>
            </div>

            <!-- Tab 2: Specs -->
            <div id="tab-specs" class="space-y-4 hidden">
                <div class="flex gap-2">
                    <input type="text" id="new-spec" placeholder="اختصاص جديد..." class="flex-1 p-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white">
                    <button onclick="addSpec()" class="px-4 py-2 bg-cyan-600 text-white font-bold rounded-xl cursor-pointer">إضافة</button>
                </div>
                <div id="admin-specs-list" class="space-y-2"></div>
            </div>

            <!-- Tab 3: Cards -->
            <div id="tab-cards" class="space-y-4 hidden">
                <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-800 space-y-2">
                    <input type="text" id="card-title" placeholder="عنوان البطاقة" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white">
                    <input type="text" id="card-desc" placeholder="الوصف الفرعي" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white">
                    <input type="text" id="card-url" placeholder="الرابط (اتركه فارغاً للتواصل)" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white">
                    <select id="card-icon" class="w-full p-2 rounded-lg bg-slate-800 border border-slate-700 text-white">
                        <option value="fa-solid fa-palette">🎨 أدوات التصميم</option>
                        <option value="fa-solid fa-cubes">🧊 مجسمات ثلاثية الأبعاد</option>
                        <option value="fa-solid fa-print">𝌚 فصل ألوان وطباعة</option>
                        <option value="fa-solid fa-envelope">✉️ تواصل مباشر</option>
                    </select>
                    <label class="flex items-center gap-2"><input type="checkbox" id="card-featured"> <span>تمييز البطاقة (لون بارز)</span></label>
                    <button onclick="addCard()" class="w-full py-2 bg-cyan-600 text-white font-bold rounded-lg cursor-pointer">إضافة البطاقة</button>
                </div>
                <div id="admin-cards-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <footer class="text-center text-xs text-slate-500 py-4">جميع الحقوق محفوظة &copy; محمود</footer>

    <script>
        const defaultConfig = {
            name: "محمود",
            bio: "مصمم جرافيك ومهندس تصميم واجهات ثلاثي الأبعاد وخبير فصل ألوان وتقنيات الطباعة",
            img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300",
            specs: ["تصميم جرافيك", "تكسية أليكوبوند 3D", "فصل ألوان وطباعة", "AutoCAD & 3ds Max"],
            socials: [
                {name: "فيسبوك", icon: "fa-brands fa-facebook", url: "https://facebook.com"},
                {name: "انستغرام", icon: "fa-brands fa-instagram", url: "https://instagram.com"},
                {name: "تلغرام", icon: "fa-brands fa-telegram", url: "https://t.me"},
                {name: "واتساب", icon: "fa-brands fa-whatsapp", url: "https://wa.me"}
            ],
            cards: [
                {title: "معرض أعمالي في التصميم", desc: "تصفح مشاريع الجرافيك والواجهات والـ 3D", url: "https://example.com/portfolio", icon: "fa-solid fa-palette", featured: true},
                {title: "تواصل معي مباشرة", desc: "للاستشارات وطلبات التصميم الخاصة", url: "", icon: "fa-solid fa-envelope", featured: false}
            ]
        };

        let siteData = defaultConfig;
        try {
            const saved = localStorage.getItem('mahmoud_site_v6');
            if(saved) siteData = JSON.parse(saved);
        } catch(e) {}

        function saveData() {
            localStorage.setItem('mahmoud_site_v6', JSON.stringify(siteData));
            renderSite();
        }

        function renderSite() {
            document.getElementById('profile-name').textContent = siteData.name;
            document.getElementById('profile-bio').textContent = siteData.bio;
            document.getElementById('profile-img').src = siteData.img;

            document.getElementById('specs-container').innerHTML = siteData.specs.map(s => 
                `<span class="px-3 py-1 rounded-full text-xs bg-cyan-950 text-cyan-300 border border-cyan-800">${s}</span>`
            ).join('');

            document.getElementById('social-container').innerHTML = siteData.socials.map(s => 
                `<a href="${s.url}" target="_blank" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-200 hover:text-cyan-400"><i class="${s.icon} text-lg"></i></a>`
            ).join('');

            document.getElementById('cards-container').innerHTML = siteData.cards.map(c => `
                <a href="${c.url || '#'}" ${!c.url ? 'onclick="alert(\'أهلاً بك، تواصل معنا مباشرة\')"' : 'target="_blank"'} class="block p-4 rounded-2xl ${c.featured ? 'bg-gradient-to-r from-cyan-600 to-blue-600 text-white shadow-lg' : 'glass border border-slate-800'} transition-all hover:scale-[1.01]">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-slate-900/50 flex items-center justify-center text-cyan-400"><i class="${c.icon}"></i></div>
                        <div class="flex-1 text-right">
                            <h3 class="font-bold text-sm">${c.title}</h3>
                            <p class="text-xs opacity-80">${c.desc}</p>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        function openAdmin() {
            document.getElementById('input-name').value = siteData.name;
            document.getElementById('input-bio').value = siteData.bio;
            document.getElementById('input-img').value = siteData.img;
            renderAdminLists();
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdmin() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function switchTab(tab) {
            ['profile', 'specs', 'cards'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}-btn`).className = "px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-bold cursor-pointer";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}-btn`).className = "px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-bold cursor-pointer";
        }

        function renderAdminLists() {
            document.getElementById('admin-specs-list').innerHTML = siteData.specs.map((s, i) => `
                <div class="flex justify-between items-center bg-slate-800 p-2 rounded-xl">
                    <span>${s}</span>
                    <button onclick="siteData.specs.splice(${i},1); saveData(); renderAdminLists();" class="text-rose-400 cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');

            document.getElementById('admin-cards-list').innerHTML = siteData.cards.map((c, i) => `
                <div class="flex justify-between items-center bg-slate-800 p-2 rounded-xl">
                    <span class="font-bold">${c.title}</span>
                    <button onclick="siteData.cards.splice(${i},1); saveData(); renderAdminLists();" class="text-rose-400 cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function saveProfile() {
            siteData.name = document.getElementById('input-name').value;
            siteData.bio = document.getElementById('input-bio').value;
            siteData.img = document.getElementById('input-img').value;
            saveData();
            alert("تم حفظ الملف الشخصي بنجاح!");
        }

        function addSpec() {
            const val = document.getElementById('new-spec').value.trim();
            if(val) { siteData.specs.push(val); document.getElementById('new-spec').value = ''; saveData(); renderAdminLists(); }
        }

        function addCard() {
            const title = document.getElementById('card-title').value.trim();
            const desc = document.getElementById('card-desc').value.trim();
            const url = document.getElementById('card-url').value.trim();
            const icon = document.getElementById('card-icon').value;
            const featured = document.getElementById('card-featured').checked;
            if(title) {
                siteData.cards.push({title, desc, url, icon, featured});
                document.getElementById('card-title').value = '';
                document.getElementById('card-desc').value = '';
                document.getElementById('card-url').value = '';
                document.getElementById('card-featured').checked = false;
                saveData(); renderAdminLists();
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('bg-slate-950');
            document.body.classList.toggle('bg-slate-100');
            document.body.classList.toggle('text-slate-100');
            document.body.classList.toggle('text-slate-900');
        }

        renderSite();
    </script>
</body>
</html>
