<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمود - شجرة الروابط</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col justify-between">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transform -translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 text-sm font-semibold pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">تمت العملية بنجاح</span>
    </div>

    <!-- Header Actions -->
    <header class="max-w-xl mx-auto w-full p-4 flex justify-between items-center relative z-10">
        <button onclick="openAdmin()" class="px-3 py-1.5 rounded-xl bg-white/80 dark:bg-slate-800/80 shadow-sm border border-slate-200 dark:border-slate-700 hover:scale-105 transition-all text-xs font-bold flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-lock text-slate-500 dark:text-slate-400"></i>
            <span>لوحة التحكم</span>
        </button>
        <div class="flex items-center gap-2">
            <button onclick="shareLink()" class="w-10 h-10 rounded-xl bg-white/80 dark:bg-slate-800/80 shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-center hover:scale-105 transition-all cursor-pointer">
                <i class="fa-solid fa-share-nodes"></i>
            </button>
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-white/80 dark:bg-slate-800/80 shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-center hover:scale-105 transition-all cursor-pointer">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto w-full px-4 pb-12 flex-1 flex flex-col items-center">
        <!-- Profile Section -->
        <div class="text-center w-full mb-6">
            <div class="relative w-28 h-28 mx-auto mb-4">
                <img id="profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300" alt="صورة الشخصية" class="w-full h-full rounded-full object-cover shadow-xl border-4 border-white dark:border-slate-800">
                <span class="absolute bottom-1 right-1 w-5 h-5 bg-emerald-500 border-2 border-white dark:border-slate-800 rounded-full"></span>
            </div>
            <h1 id="profile-name" class="text-2xl font-extrabold tracking-wide mb-1">محمود</h1>
            <p id="profile-bio" class="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto leading-relaxed mb-4">مصمم جرافيك ومهمندس تصميم واجهات ثلاثي الأبعاد وخبير فصل ألوان وتقنيات الطباعة</p>
            
            <!-- Specialties Badges -->
            <div id="specialties-list" class="flex flex-wrap justify-center gap-2 mb-6"></div>

            <!-- Social Media Icons -->
            <div id="social-icons-list" class="flex justify-center items-center gap-3 mb-6"></div>
        </div>

        <!-- Links Cards Section -->
        <div id="cards-container" class="w-full space-y-3"></div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400 dark:text-slate-600">
        جميع الحقوق محفوظة &copy; <span id="year"></span> محمود
    </footer>

    <!-- Contact Modal -->
    <div id="contact-modal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl p-6 shadow-2xl relative border border-slate-100 dark:border-slate-800">
            <button onclick="closeModal('contact-modal')" class="absolute top-4 left-4 w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-paper-plane text-cyan-500"></i>
                <span>تواصل معي مباشرة</span>
            </h3>
            <form onsubmit="handleContactSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1">الاسم الكامل</label>
                    <input type="text" required class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">البريد الإلكتروني / رقم الهاتف</label>
                    <input type="text" required class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none
