<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمود - شجرة الروابط</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-300 flex flex-col justify-between">

    <!-- Header Actions -->
    <header class="max-w-xl mx-auto w-full p-4 flex justify-between items-center relative z-10">
        <button onclick="openAdmin()" class="px-3 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-700 text-white shadow-lg transition-all text-xs font-bold flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-sliders"></i>
            <span>لوحة التحكم الكاملة</span>
        </button>
        <div class="flex items-center gap-2">
            <button onclick="shareLink()" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center hover:scale-105 transition-all cursor-pointer">
                <i class="fa-solid fa-share-nodes"></i>
            </button>
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center hover:scale-105 transition-all cursor-pointer">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto w-full px-4 pb-12 flex-1 flex flex-col items-center">
        <!-- Profile Section -->
        <div class="text-center w-full mb-6">
            <div class="relative w-28 h-28 mx-auto mb-4">
                <img id="profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300" alt="صورة الشخصية" class="w-full h-full rounded-full object-cover shadow-xl border-4 border-cyan-500">
                <span class="absolute bottom-1 right-1 w-5 h-5 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
            </div>
            <h1 id="profile-name" class="text-2xl font-extrabold tracking-wide mb-1">محمود</h1>
            <p id="profile-bio" class="text-xs text-slate-400 max-w-sm mx-auto leading-relaxed mb-4">مصمم جرافيك ومهندس تصميم واجهات ثلاثي الأبعاد وخبير فصل ألوان وتقنيات الطباعة</p>
            
            <!-- Specialties Badges -->
            <div id="specialties-list" class="flex flex-wrap justify-center gap-2 mb-6"></div>

            <!-- Social Media Icons -->
            <div id="social-icons-list" class="flex justify-center items-center gap-3 mb-6"></div>
        </div>

        <!-- Links Cards Section -->
        <div id="cards-container" class="w-full space-y-3"></div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500">
        جميع الحقوق محفوظة &copy; <span id="year"></span> محمود
    </footer>

    <!-- Contact Modal -->
    <div id="contact-modal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
            <button onclick="closeModal('contact-modal')" class="absolute top-4 left-4 w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2 text-cyan-400">
                <i class="fa-solid fa-paper-plane"></i>
                <span>تواصل معي مباشرة</span>
            </h3>
            <form onsubmit="handleContactSubmit(event)" class="space-y-4 text-xs text-right">
                <div>
                    <label class="block font-semibold mb-1">الاسم الكامل</label>
                    <input type="text" required class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
                </div>
                <div>
                    <label class="block font-semibold mb-1">البريد الإلكتروني / رقم الهاتف</label>
                    <input type="text" required class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
                </div>
                <div>
                    <label class="block font-semibold mb-1">الرسالة</label>
                    <textarea rows="3" required class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"></textarea>
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-700 text-white font-bold shadow-lg cursor-pointer">إرسال الرسالة</button>
            </form>
        </div>
    </div>

    <!-- Full Admin Panel Modal -->
    <div id="admin-modal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl shadow-2xl relative max-h-[90vh] flex flex-col">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <div class="flex items-center gap-2 text-cyan-400 font-bold">
                    <i class="fa-solid fa-sliders"></i>
                    <h3>لوحة إدارة الموقع الشاملة</h3>
                </div>
                <button onclick="closeModal('admin-modal')" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Tabs Navigation -->
            <div class="flex border-b border-slate-800 bg-slate-950 px-4 gap-2 overflow-x-auto text-xs">
                <button onclick="switchTab('profile')" id="tab-btn-profile" class="py-3 px-4 font-bold border-b-2 border-cyan-500 text-cyan-400 cursor-pointer">الملف الشخصي</button>
                <button onclick="switchTab('specs')" id="tab-btn-specs" class="py-3 px-4 font-bold border-b-2 border-transparent text-slate-400 cursor-pointer">الاختصاصات</button>
                <button onclick="switchTab('social')" id="tab-btn-social" class="py-3 px-4 font-bold border-b-2 border-transparent text-slate-400 cursor-pointer">التواصل</button>
                <button onclick="switchTab('cards')" id="tab-btn-cards" class="py-3 px-4 font-bold border-b-2 border-transparent text-slate-400 cursor-pointer">البطاقات</button>
            </div>

            <div class="p-6 overflow-y-auto flex-1 space-y-6 text-xs text-right">
                <!-- Tab: Profile -->
                <div id="tab-profile" class="space-y-4">
                    <h4 class="font-bold border-b border-slate-800 pb-2 text-cyan-300">بيانات الملف الشخصي</h4>
                    <div class="space-y-3">
                        <div>
                            <label class="block font-semibold mb-1">الاسم</label>
                            <input type="text" id="admin-profile-name" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1">النبذة التعريفية</label>
                            <textarea id="admin-profile-bio" rows="3" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white"></textarea>
                        </div>
                        <div>
                            <label class="block font-semibold mb-1">رابط الصورة الشخصية (URL)</label>
                            <input type="text" id="admin-profile-img" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white">
                        </div>
                        <button onclick="saveProfileChanges()" class="px-4 py-2 bg-cyan-600 text-white rounded-xl font-bold hover:bg-cyan-700 cursor-pointer">حفظ التعديلات</button>
                    </div>
                </div>

                <!-- Tab: Specialties -->
                <div id="tab-specs" class="space-y-4 hidden">
                    <h4 class="font-bold border-b border-slate-800 pb-2 text-cyan-300">إدارة الاختصاصات والوسوم</h4>
                    <div class="flex gap-2">
                        <input type="text" id="new-spec-input" placeholder="اختصاص جديد..." class="flex-1 px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white">
                        <button onclick="addSpecialty()" class="px-4 py-2 bg-cyan-600 text-white rounded-xl font-bold cursor-pointer">إضافة</button>
                    </div>
                    <div id="admin-specs-list" class="space-y-2"></div>
                </div>

                <!-- Tab: Social -->
                <div id="tab-social" class="space-y-4 hidden">
                    <h4 class="font-bold border-b border-slate-800 pb-2 text-cyan-300">أيقونات التواصل الاجتماعي</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <select id="social-platform-select" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white">
                            <option value="facebook|fa-brands fa-facebook|فيسبوك">فيسبوك</option>
                            <option value="instagram|fa-brands fa-instagram|انستغرام">انستغرام</option>
                            <option value="telegram|fa-brands fa-telegram|تلغرام">تلغرام</option>
                            <option value="whatsapp|fa-brands fa-whatsapp|واتساب">واتساب</option>
                            <option value="linkedin|fa-brands fa-linkedin|لينكد إن">لينكد إن</option>
                        </select>
                        <input type="text" id="social-url-input" placeholder="https://..." class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white">
                    </div>
                    <button onclick="addSocialIcon()" class="w-full py-2 bg-cyan-600 text-white rounded-xl font-bold cursor-pointer">إضافة منصة تواصل</button>
                    <div id="admin-social-list" class="space-y-2 mt-4"></div>
                </div>

                <!-- Tab: Cards -->
                <div id="tab-cards" class="space-y-4 hidden">
                    <h4 class="font-bold border-b border-slate-800 pb-2 text-cyan-300">إدارة البطاقات والروابط الرئيسية</h4>
                    <div class="space-y-3 bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                        <input type="text" id="card-title-input" placeholder="عنوان البطاقة" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white">
                        <input type="text" id="card-desc-input" placeholder="الوصف الفرعي" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white">
                        <input type="text" id="card-url-input" placeholder="الرابط (اتركه فارغاً للتواصل المباشر)" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white">
                        <select id="card-icon-select" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white">
                            <option value="fa-solid fa-palette">🎨 أدوات التصميم</option>
                            <option value="fa-solid fa-cubes">🧊 مجسمات ثلاثية الأبعاد</option>
                            <option value="fa-solid fa-print">𝌚 طباعة وفصل ألوان</option>
                            <option value="fa-solid fa-envelope">✉️ تواصل مباشر</option>
                            <option value="fa-solid fa-briefcase">💼 حقيبة أعمال</option>
                        </select>
                        <label class="flex items-center gap-2 font-semibold">
                            <input type="checkbox" id="card-featured-check" class="rounded border-slate-700 text-cyan-600">
                            <span>تمييز البطاقة (لون بارز)</span>
                        </label>
                        <button onclick="addMainCard()" class="w-full py-2 bg-cyan-600 text-white rounded-xl font-bold cursor-pointer">إضافة البطاقة</button>
                    </div>
                    <div id="admin-cards-list" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        const defaultState = {
            profile: {
                name: "محمود",
                bio: "مصمم جرافيك ومهندس تصميم واجهات ثلاثي الأبعاد وخبير فصل ألوان وتقنيات الطباعة",
                img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300"
            },
            specialties: ["تصميم جرافيك", "تكسية أليكوبوند 3D", "فصل ألوان وطباعة", "AutoCAD & 3ds Max"],
            socials: [
                { id: "1", name: "فيسبوك", icon: "fa-brands fa-facebook", url: "https://facebook.com" },
                { id: "2", name: "انستغرام", icon: "fa-brands fa-instagram", url: "https://instagram.com" },
                { id: "3", name: "تلغرام", icon: "fa-brands fa-telegram", url: "https://t.me" },
                { id: "4", name: "واتساب", icon: "fa-brands fa-whatsapp", url: "https://wa.me" }
            ],
            cards: [
                { id: "c1", title: "معرض أعمالي في التصميم", desc: "تصفح مشاريع الجرافيك والواجهات والـ 3D", url: "https://example.com/portfolio", icon: "fa-solid fa-palette", featured: true },
                { id: "c2", title: "المدونة التقنية", desc: "مقالات حول فصل الألوان والطباعة والهندسة", url: "https://example.com/blog", icon: "fa-solid fa-laptop-code", featured: false },
                { id: "c3", title: "تواصل معي مباشرة", desc: "للاستشارات وطلبات التصميم الخاصة", url: "", icon: "fa-solid fa-envelope", featured: false }
            ]
        };

        let appData = defaultState;
        try {
            const saved = localStorage.getItem('mahmoud_linktree_v4');
            if (saved) appData = JSON.parse(saved);
        } catch(e) {}

        function saveData() {
            localStorage.setItem('mahmoud_linktree_v4', JSON.stringify(appData));
            renderUI();
        }

        function renderUI() {
            document.getElementById('profile-name').textContent = appData.profile.name;
            document.getElementById('profile-bio').textContent = appData.profile.bio;
            document.getElementById('profile-img').src = appData.profile.img;

            document.getElementById('specialties-list').innerHTML = appData.specialties.map(s => 
                `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-cyan-950/60 text-cyan-300 border border-cyan-800/50">${s}</span>`
            ).join('');

            document.getElementById('social-icons-list').innerHTML = appData.socials.map(s => 
                `<a href="${s.url}" target="_blank" title="${s.name}" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-200 hover:scale-110 hover:text-cyan-400 transition-all">
                    <i class="${s.icon} text-lg"></i>
                </a>`
            ).join('');

            document.getElementById('cards-container').innerHTML = appData.cards.map(c => {
                const isContact = !c.url;
                const actionAttr = isContact ? `onclick="openContactModal()"` : `href="${c.url}" target="_blank"`;
                const styleClass = c.featured 
                    ? "bg-gradient-to-r from-cyan-600 to-blue-600 text-white shadow-lg shadow-cyan-500/20" 
                    : "glass text-slate-100 border border-slate-800";

                return `
                <a ${actionAttr} class="block w-full p-4 rounded-2xl transition-all duration-300 ${styleClass} group relative overflow-hidden cursor-pointer hover:scale-[1.01]">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold ${c.featured ? 'bg-white/20 text-white' : 'bg-slate-800 text-cyan-400'}">
                            <i class="${c.icon}"></i>
                        </div>
                        <div class="flex-1 text-right">
                            <h3 class="font-bold text-sm md:text-base">${c.title}</h3>
                            <p class="text-xs ${c.featured ? 'text-white/80' : 'text-slate-400'} mt-0.5">${c.desc}</p>
                        </div>
                        <i class="fa-solid fa-chevron-left text-xs opacity-40"></i>
                    </div>
                </a>`;
            }).join('');

            document.getElementById('year').textContent = new Date().getFullYear();
        }

        function openAdmin() {
            renderAdminData();
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function openContactModal() { document.getElementById('contact-modal').classList.remove('hidden'); }

        function switchTab(tab) {
            ['profile', 'specs', 'social', 'cards'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`tab-btn-${t}`).className = "py-3 px-4 font-bold border-b-2 border-transparent text-slate-400 cursor-pointer";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tab}`).className = "py-3 px-4 font-bold border-b-2 border-cyan-500 text-cyan-400 cursor-pointer";
        }

        function renderAdminData() {
            document.getElementById('admin-profile-name').value = appData.profile.name;
            document.getElementById('admin-profile-bio').value = appData.profile.bio;
            document.getElementById('admin-profile-img').value = appData.profile.img;

            document.getElementById('admin-specs-list').innerHTML = appData.specialties.map((s, i) => `
                <div class="flex justify-between items-center bg-slate-800 px-3 py-2 rounded-xl">
                    <span>${s}</span>
                    <button onclick="appData.specialties.splice(${i},1); saveData(); renderAdminData();" class="text-rose-400 cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');

            document.getElementById('admin-social-list').innerHTML = appData.socials.map((s, i) => `
                <div class="flex justify-between items-center bg-slate-800 px-3 py-2 rounded-xl">
                    <span><i class="${s.icon}"></i> ${s.name}</span>
                    <button onclick="appData.socials.splice(${i},1); saveData()
